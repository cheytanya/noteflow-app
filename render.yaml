services:
  - type: web
    name: noteflow-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: noteflow-db
          property: connectionString

databases:
  - name: noteflow-db
    databaseName: noteflow
    user: noteflow_user
